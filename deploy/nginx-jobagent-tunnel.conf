# Öffentlich über Cloudflare Tunnel: cloudflared (lokal) -> http://127.0.0.1:8091 -> App (127.0.0.1:8090).
# Kein eingehender Port nach außen; 8091 lauscht nur auf localhost.
server {
    listen 127.0.0.1:8091 default_server;
    server_name _;
    return 444;
}
server {
    listen 127.0.0.1:8091;
    server_name jobagent.paeffgen-it.de;
    server_tokens off;
    # Client-Adresse nur von cloudflared (localhost) übernehmen
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
