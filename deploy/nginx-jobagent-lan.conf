# LAN: https://192.168.178.217/jobagent/ – eingebunden im default-Server (443) von CT 106.
location = /jobagent { return 301 /jobagent/; }
location /jobagent/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 12m;
    # eigener add_header: die Kopfzeilen des default-Servers nicht erben (die App setzt strengere)
    add_header X-Jobagent-Zugang lan always;
}
